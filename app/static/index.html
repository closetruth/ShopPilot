<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>店铺客服</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <button class="new-chat" id="newChat" type="button">
          <span aria-hidden="true">+</span> 新对话
        </button>
      </div>
      <nav class="conv-list" id="convList" aria-label="历史对话"></nav>
    </aside>

    <section class="main">
      <header class="header">
        <button class="toggle" id="toggle" type="button" aria-label="切换侧栏">☰</button>
        <div class="avatar">客</div>
        <div class="header-text">
          <h1>店铺客服</h1>
          <span class="status" id="status">在线</span>
        </div>
        <button class="orders-btn" id="ordersBtn" type="button">我的工单</button>
      </header>

      <main class="messages" id="messages" aria-live="polite"></main>

      <form class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="请输入问题…" autocomplete="off"></textarea>
        <button type="submit" id="send" aria-label="发送">发送</button>
      </form>
    </section>

    <aside class="orders-panel" id="ordersPanel" aria-label="我的订单与工单" hidden>
      <div class="orders-head">
        <div class="panel-tabs">
          <button class="panel-tab active" id="tabOrders" type="button">我的订单</button>
          <button class="panel-tab" id="tabWorkOrders" type="button">我的工单</button>
        </div>
        <button class="orders-close" id="ordersClose" type="button" aria-label="关闭">×</button>
      </div>
      <div class="orders-body">
        <p class="orders-empty" id="ordersEmpty" hidden>还没有订单</p>
        <div class="orders-list" id="ordersList"></div>
        <p class="orders-empty" id="woEmpty" hidden>还没有工单</p>
        <div class="orders-list" id="woList" hidden></div>
      </div>
    </aside>
  </div>
  <script src="/app.js"></script>
</body>
</html>
